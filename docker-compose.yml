version: "3"

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - biometric-service
      - redis

  biometric-service:
    build: ./biometric-service
    ports:
      - "5000:5000"

  redis:
    image: redis:7-alpine
